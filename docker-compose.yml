services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/muletrace.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - CORS_ORIGINS=http://localhost:5173
      - UPLOAD_DIR=./data/uploads
      - REPORT_DIR=./data/reports
      - PARQUET_DIR=./data/parquet
      - DEFAULT_CURRENCY=INR
      - DEFAULT_TIMEZONE=Asia/Kolkata
      - SEED=42
      - LLM_SUMMARY=false
      - NEO4J_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional Neo4j profile
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    profiles:
      - neo4j

volumes:
  neo4j_data:
