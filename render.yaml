services:
  # ── 1. Python FastAPI Backend Service (Docker) ──
  - type: web
    name: muletrace-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: CORS_ORIGINS
        value: "*"

  # ── 2. React Vite Frontend Static Site ──
  - type: web
    name: muletrace-web
    env: static
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router SPA redirect
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: VITE_API_URL
        value: ""
