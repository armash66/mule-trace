services:
  # ── 1. Python FastAPI Backend Service ──
  - type: web
    name: muletrace-api
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"

  # ── 2. React Vite Frontend Static Site ──
  - type: web
    name: muletrace-web
    env: static
    plan: free
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # React Router SPA redirect
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: ""
